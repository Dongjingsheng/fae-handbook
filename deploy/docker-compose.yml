# ============================================================
# docker-compose.yml — NAS/无K8s环境的备选部署方案
# 用法: docker compose up -d   → 访问 http://<NAS-IP>:8080
# ============================================================
services:
  fae-handbook:
    image: nginx:1.27-alpine
    container_name: fae-handbook
    restart: unless-stopped
    ports:
      - "8080:80"                 # 宿主8080 → 容器80
    volumes:
      # dist 目录挂在 Nginx html 路径
      - ../dist:/usr/share/nginx/html:ro
      # 配置文件（可复用 K8s 用的 nginx.conf）
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3