# ============================================================
# deploy.yml — GitHub Actions 自动部署到 Pages
# 触发：push 到 main 分支时自动构建并发布
# 不需要手动跑构建，push 代码即可
# ============================================================
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # 支持在 Actions 页面手动触发

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fae-handbook/package-lock.json

      - name: Install dependencies
        working-directory: fae-handbook
        run: npm ci

      - name: Validate data
        working-directory: fae-handbook
        run: npm run validate

      - name: Build
        working-directory: fae-handbook
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: fae-handbook/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4